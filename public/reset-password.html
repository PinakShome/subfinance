<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — SubFinance</title>
  <style>
    :root { --bg:#f5f4fb; --card:#ffffff; --ink:#1b1830; --mute:#6a6782;
      --purple:#8b5cf6; --purpleDark:#7c3aed; --border:#e5e3ef; --err:#ef4444; --ok:#10b981; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg); color:var(--ink); min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:24px;
      padding:32px 28px; width:100%; max-width:400px;
      box-shadow:0 12px 40px rgba(124,60,237,0.10); }
    .mark { display:flex; gap:8px; align-items:center; justify-content:center; margin-bottom:8px; }
    .mark .c1 { width:34px; height:34px; border-radius:50%; background:var(--purple); }
    .mark .c2 { width:20px; height:20px; border-radius:50%; background:#22d3ee; margin-left:-14px; margin-top:12px; }
    h1 { font-size:22px; text-align:center; margin:6px 0 4px; font-weight:800; }
    p.sub { text-align:center; color:var(--mute); font-size:14px; margin:0 0 22px; }
    label { display:block; font-size:13px; font-weight:600; color:var(--mute); margin:14px 0 6px; }
    input { width:100%; padding:13px 14px; border:1px solid var(--border); border-radius:12px;
      font-size:15px; background:#faf9ff; color:var(--ink); outline:none; }
    input:focus { border-color:var(--purple); }
    button { width:100%; margin-top:22px; padding:14px; border:none; border-radius:12px;
      background:var(--purple); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:default; }
    .msg { margin-top:16px; font-size:14px; text-align:center; border-radius:12px; padding:12px; display:none; }
    .msg.err { background:#fef2f2; color:var(--err); display:block; }
    .msg.ok { background:#ecfdf5; color:var(--ok); display:block; }
    .hint { font-size:12px; color:var(--mute); margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"><div class="c1"></div><div class="c2"></div></div>
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your SubFinance account.</p>

    <div id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password" />
      <button id="btn">Update password</button>
      <div class="hint">After updating, return to the SubFinance app and log in.</div>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    var SUPABASE_URL = "https://nbyromyypuvowkthheza.supabase.co";
    var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ieXJvbXl5cHV2b3drdGhoZXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzg2OTgsImV4cCI6MjA5MjgxNDY5OH0.YU8NbBcgwmc48mCLQ61FxS3uJxHQY_g7GwL_Uvx3vz8";

    // Recovery token arrives in the URL fragment: #access_token=...&type=recovery
    var hash = new URLSearchParams(window.location.hash.slice(1));
    var accessToken = hash.get("access_token");
    var type = hash.get("type");
    var form = document.getElementById("form");
    var msg = document.getElementById("msg");
    var btn = document.getElementById("btn");

    function show(kind, text) { msg.className = "msg " + kind; msg.textContent = text; }

    if (!accessToken || type !== "recovery") {
      form.style.display = "none";
      show("err", "This reset link is invalid or has expired. Request a new one from the app.");
    }

    btn && btn.addEventListener("click", async function () {
      var pw = document.getElementById("pw").value;
      var pw2 = document.getElementById("pw2").value;
      if (pw.length < 6) { show("err", "Password must be at least 6 characters."); return; }
      if (pw !== pw2) { show("err", "Passwords don't match."); return; }
      btn.disabled = true; btn.textContent = "Updating…"; msg.className = "msg";
      try {
        var res = await fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "apikey": ANON,
            "Authorization": "Bearer " + accessToken
          },
          body: JSON.stringify({ password: pw })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.msg || data.error_description || data.message || "Could not update password.");
        form.style.display = "none";
        show("ok", "✓ Password updated. Return to the SubFinance app and log in with your new password.");
      } catch (e) {
        btn.disabled = false; btn.textContent = "Update password";
        show("err", e.message);
      }
    });
  </script>
</body>
</html>
